<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">劈瓜冻结样例的完整岗位关系图</title><desc id="desc">一个价值流连接四项工作事项、十七项业务实体和四项能力。</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f7f2e8"/><stop offset="1" stop-color="#e4eee3"/></linearGradient><filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#1f2722" flood-opacity=".12"/></filter></defs>
  <rect width="1600" height="1000" fill="url(#bg)"/><rect x="44" y="34" width="1512" height="932" rx="32" fill="#fffaf1" stroke="#d8ded4" stroke-width="2"/>
  <text x="88" y="95" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" font-size="34" font-weight="700" fill="#1f2722">冻结样例 · 完整岗位关系图</text><text x="88" y="132" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" fill="#667067">1 条价值流 · 4 项工作事项 · 17 个业务实体 · 4 项能力</text>
  <g font-family="PingFang SC, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="700" fill="#667067"><text x="115" y="205">价值流</text><text x="408" y="205">工作事项</text><text x="752" y="205">业务实体（按工作项归集）</text><text x="1328" y="205">能力</text></g>
  <g stroke="#b8c5ba" stroke-width="3" fill="none"><path d="M336 450 L405 300"/><path d="M336 450 L405 410"/><path d="M336 450 L405 520"/><path d="M336 450 L405 630"/><path d="M655 300 L744 300"/><path d="M655 410 L744 410"/><path d="M655 520 L744 520"/><path d="M655 630 L744 630"/><path d="M1215 300 L1320 300"/><path d="M1215 410 L1320 410"/><path d="M1215 520 L1320 520"/><path d="M1215 630 L1320 630"/></g>
  <g filter="url(#shadow)"><rect x="92" y="380" width="245" height="140" rx="28" fill="#1f5b46"/><text x="214" y="435" text-anchor="middle" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="700" fill="#fffaf1">AI 场景从发现</text><text x="214" y="467" text-anchor="middle" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="700" fill="#fffaf1">到上线运营</text></g>
  <g fill="#2f8d5b" filter="url(#shadow)"><rect x="405" y="250" width="250" height="100" rx="20"/><rect x="405" y="360" width="250" height="100" rx="20"/><rect x="405" y="470" width="250" height="100" rx="20"/><rect x="405" y="580" width="250" height="100" rx="20"/></g>
  <g font-family="PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="700" fill="#fffaf1"><text x="530" y="308" text-anchor="middle">识别 AI 可改造业务节点</text><text x="530" y="418" text-anchor="middle">设计 AI 产品方案</text><text x="530" y="528" text-anchor="middle">推进 AI 能力落地</text><text x="530" y="638" text-anchor="middle">跟踪 AI 业务指标</text></g>
  <g fill="#f6dfb9" stroke="#d69035" stroke-width="2" filter="url(#shadow)"><rect x="744" y="236" width="470" height="128" rx="20"/><rect x="744" y="346" width="470" height="128" rx="20"/><rect x="744" y="456" width="470" height="128" rx="20"/><rect x="744" y="566" width="470" height="128" rx="20"/></g>
  <g font-family="PingFang SC, Noto Sans CJK SC, sans-serif" font-size="17" fill="#1f2722"><text x="770" y="278" font-weight="700">售前导购 · 售后服务 · 质检提效 · 营销转化</text><text x="770" y="316">→ AI 可改造业务节点清单</text><text x="770" y="388" font-weight="700">智能问答方案 · 智能推荐方案</text><text x="770" y="426">→ 自动化工作流方案</text><text x="770" y="498" font-weight="700">知识库 · 工作流编排 · 质检分析能力</text><text x="770" y="536">→ 知识库内容 · 工作流编排配置</text><text x="770" y="608" font-weight="700">咨询转化率 · 问题解决率</text><text x="770" y="646">→ 人工替代率 · 客服效率提升</text></g>
  <g fill="#a0472d" filter="url(#shadow)"><rect x="1320" y="250" width="180" height="100" rx="20"/><rect x="1320" y="360" width="180" height="100" rx="20"/><rect x="1320" y="470" width="180" height="100" rx="20"/><rect x="1320" y="580" width="180" height="100" rx="20"/></g>
  <g font-family="PingFang SC, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="700" fill="#fffaf1"><text x="1410" y="292" text-anchor="middle">业务流程</text><text x="1410" y="320" text-anchor="middle">分析能力</text><text x="1410" y="402" text-anchor="middle">AI 产品方案</text><text x="1410" y="430" text-anchor="middle">设计能力</text><text x="1410" y="512" text-anchor="middle">AI 能力落地</text><text x="1410" y="540" text-anchor="middle">协同能力</text><text x="1410" y="622" text-anchor="middle">AI 业务指标</text><text x="1410" y="650" text-anchor="middle">评测能力</text></g>
  <g font-family="PingFang SC, Noto Sans CJK SC, sans-serif" font-size="18" fill="#667067"><text x="90" y="810">图谱不是关键词云：每一列都能追溯到 JD 中的职责、业务对象和能力要求。</text><circle cx="95" cy="875" r="9" fill="#1f5b46"/><text x="112" y="881">价值流</text><circle cx="235" cy="875" r="9" fill="#2f8d5b"/><text x="252" y="881">工作事项</text><circle cx="395" cy="875" r="9" fill="#d69035"/><text x="412" y="881">业务实体</text><circle cx="555" cy="875" r="9" fill="#a0472d"/><text x="572" y="881">能力</text><text x="1115" y="881" font-weight="700" fill="#1f5b46">脱敏冻结样例 · 不调用 LLM</text></g>
</svg>
