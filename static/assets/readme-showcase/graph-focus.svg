<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">劈瓜冻结样例的聚焦岗位图谱</title>
  <desc id="desc">从 AI 场景价值流依次连接工作事项、业务实体与能力的图谱局部。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f7f2e8"/><stop offset="1" stop-color="#e4eee3"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#1f2722" flood-opacity=".13"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#9caea0"/></marker>
  </defs>
  <rect width="1200" height="720" fill="url(#bg)"/>
  <rect x="48" y="38" width="1104" height="644" rx="30" fill="#fffaf1" stroke="#d8ded4" stroke-width="2"/>
  <text x="92" y="100" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" font-size="34" font-weight="700" fill="#1f2722">把 JD 从职责清单还原成岗位结构</text>
  <text x="92" y="138" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" fill="#667067">冻结展示样例 · 图谱局部路径 · 不调用 LLM</text>
  <rect x="943" y="76" width="158" height="40" rx="20" fill="#dfe9df"/>
  <text x="1022" y="102" text-anchor="middle" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="700" fill="#1f5b46">AI PM JD Analyzer</text>
  <g font-family="PingFang SC, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="700" fill="#667067"><text x="115" y="210">价值流</text><text x="390" y="210">工作事项</text><text x="680" y="210">业务实体</text><text x="955" y="210">需要能力</text></g>
  <g stroke="#9caea0" stroke-width="4" fill="none" marker-end="url(#arrow)"><path d="M330 345 C355 345 362 310 388 310"/><path d="M330 390 C355 390 362 440 388 440"/><path d="M602 310 C633 310 640 310 670 310"/><path d="M602 440 C633 440 640 440 670 440"/><path d="M900 310 C926 310 930 310 950 310"/><path d="M900 440 C926 440 930 440 950 440"/></g>
  <g filter="url(#shadow)"><rect x="100" y="290" width="230" height="150" rx="28" fill="#1f5b46"/><text x="215" y="345" text-anchor="middle" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="700" fill="#fffaf1">AI 场景从发现</text><text x="215" y="378" text-anchor="middle" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="700" fill="#fffaf1">到上线运营</text><text x="215" y="410" text-anchor="middle" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" font-size="15" fill="#dfe9df">价值流 VS1</text></g>
  <g filter="url(#shadow)"><rect x="388" y="260" width="214" height="100" rx="22" fill="#2f8d5b"/><text x="495" y="305" text-anchor="middle" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="700" fill="#fffaf1">识别 AI 可改造</text><text x="495" y="332" text-anchor="middle" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="700" fill="#fffaf1">业务节点</text><rect x="388" y="390" width="214" height="100" rx="22" fill="#2f8d5b"/><text x="495" y="435" text-anchor="middle" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="700" fill="#fffaf1">设计 AI 产品</text><text x="495" y="462" text-anchor="middle" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="700" fill="#fffaf1">方案</text></g>
  <g filter="url(#shadow)"><rect x="670" y="260" width="230" height="100" rx="22" fill="#d69035"/><text x="785" y="305" text-anchor="middle" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="700" fill="#1f2722">AI 可改造业务</text><text x="785" y="332" text-anchor="middle" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="700" fill="#1f2722">节点清单</text><rect x="670" y="390" width="230" height="100" rx="22" fill="#d69035"/><text x="785" y="435" text-anchor="middle" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="700" fill="#1f2722">智能问答 · 推荐</text><text x="785" y="462" text-anchor="middle" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="700" fill="#1f2722">· 自动化工作流</text></g>
  <g filter="url(#shadow)"><rect x="950" y="260" width="170" height="100" rx="22" fill="#a0472d"/><text x="1035" y="305" text-anchor="middle" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="700" fill="#fffaf1">业务流程</text><text x="1035" y="332" text-anchor="middle" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="700" fill="#fffaf1">分析能力</text><rect x="950" y="390" width="170" height="100" rx="22" fill="#a0472d"/><text x="1035" y="435" text-anchor="middle" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="700" fill="#fffaf1">AI 产品方案</text><text x="1035" y="462" text-anchor="middle" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="700" fill="#fffaf1">设计能力</text></g>
  <g font-family="PingFang SC, Noto Sans CJK SC, sans-serif" font-size="17" fill="#667067"><circle cx="110" cy="585" r="8" fill="#1f5b46"/><text x="126" y="591">价值流</text><circle cx="245" cy="585" r="8" fill="#2f8d5b"/><text x="261" y="591">工作事项</text><circle cx="390" cy="585" r="8" fill="#d69035"/><text x="406" y="591">业务实体</text><circle cx="535" cy="585" r="8" fill="#a0472d"/><text x="551" y="591">能力</text><text x="875" y="591" fill="#1f5b46" font-weight="700">从“像 AI”到“具体做什么 AI”</text></g>
</svg>
